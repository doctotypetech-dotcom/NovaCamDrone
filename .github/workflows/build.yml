name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtmultimedia qtserialport'
          tools: 'tools_mingw1310'
          cache: true

      - name: Configure
        shell: bash
        working-directory: controller
        run: cmake -B build -G 'MinGW Makefiles' -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}

      - name: Build
        shell: bash
        working-directory: controller
        run: cmake --build build --config Release

      - name: Deploy Qt DLLs
        shell: bash
        working-directory: controller
        run: windeployqt --release --no-translations bin/controller.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCamDrone-windows
          path: controller/bin
